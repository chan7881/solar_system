<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>태양계</title>
<link rel="stylesheet" href="src/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js" } }
</script>
</head>
<body>
<script>/* 처음 그리기 전에 정한다 — 넓은 화면은 목록을 연 채로, 폰은 닫은 채로 */
if (matchMedia('(min-width: 760px)').matches) document.body.classList.add('sb-open');</script>
<aside id="sidebar" aria-label="천체 목록">
  <div class="sb-head">
    <span class="sb-title">천체</span>
    <button id="sb-close" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6M20 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>닫기</span>
    </button>
  </div>
  <div id="sb-list"></div>
</aside>
<div id="scrim" aria-hidden="true"></div>
<aside id="layers" aria-label="레이어 설정">
  <div class="sb-head">
    <span class="sb-title">레이어</span>
    <button id="ly-close" type="button">
      <span>닫기</span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6M4 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div id="ly-list"></div>
</aside>

<main id="stage">
  <canvas id="view"></canvas>
  <div id="labels"></div>

  <header id="top">
    <button id="sb-open" type="button" aria-label="천체 목록 열기" aria-controls="sidebar">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span>천체</span>
    </button>
    <label id="when-wrap" title="날짜·시각 고르기">
      <span id="date"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M4 10h16M9 3.5v4M15 3.5v4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input id="when" type="datetime-local" aria-label="날짜와 시각 고르기">
    </label>
  </header>
  <button id="atmo" type="button" role="switch" aria-checked="true" hidden>
    <span>대기</span><span class="sw-track" aria-hidden="true"><span class="sw-knob"></span></span><span id="atmo-state">켬</span>
  </button>
  <div id="tools">
    <div id="tool-menu" role="menu" aria-label="도구 고르기" hidden>
      <button type="button" role="menuitemradio" aria-checked="false" data-tool="dist"><svg class="chk" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>거리 재기</span></button>
      <button type="button" role="menuitemradio" aria-checked="false" data-tool="size"><svg class="chk" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>크기 비교</span></button>
      <button type="button" role="menuitemradio" aria-checked="false" data-tool="orbit"><svg class="chk" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg><span>궤도 보기</span></button>
    </div>
    <button id="tool-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="tool-menu">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 4.5l5 5-10 10H4.5v-5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 7l5 5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span id="tool-name">도구</span>
      <svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 14l5-5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <section id="orbit" class="tool-card" aria-label="궤도 보기" hidden>
    <div class="tc-head"><span class="tc-title">궤도 보기</span>
      <button class="tc-close" type="button" data-close="orbit"><span>닫기</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="tc-pick"><select id="orbit-body" aria-label="궤도를 볼 천체"></select></div>
    <dl class="orb-vals" aria-live="polite">
      <dt>장반경 a</dt><dd id="orb-a"></dd>
      <dt>단반경 b</dt><dd id="orb-b"></dd>
      <dt id="orb-peri-k">근일점</dt><dd id="orb-peri"></dd>
      <dt id="orb-apo-k">원일점</dt><dd id="orb-apo"></dd>
      <dt>이심률 e</dt><dd id="orb-e"></dd>
    </dl>
    <p class="orb-note" id="orb-note"></p>
  </section>
  <section id="dist" class="tool-card" aria-label="거리 재기" hidden>
    <div class="tc-head"><span class="tc-title">거리 재기</span>
      <button class="tc-close" type="button" data-close="dist"><span>닫기</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
    </div>
    <div class="tc-pick">
      <select id="dist-a" aria-label="첫째 천체"></select><span class="tc-sep" aria-hidden="true">↔</span><select id="dist-b" aria-label="둘째 천체"></select>
    </div>
    <div class="tc-val" aria-live="polite"><b id="dist-km"></b><span id="dist-sub"></span></div>
    <div id="dist-ext" class="tc-ext" hidden>
      <div class="tc-ext-row" aria-live="polite"><span class="tc-ext-k">최소</span><span id="dist-min"></span></div>
      <div class="tc-ext-row" aria-live="polite"><span class="tc-ext-k">최대</span><span id="dist-max"></span></div>
      <div class="tc-ext-foot"><span class="tc-ext-note">1800~2050년 중</span>
        <button id="dist-ext-show" type="button" role="switch" aria-checked="false"><span>그때 위치</span><span class="sw-track" aria-hidden="true"><span class="sw-knob"></span></span></button>
      </div>
    </div>
  </section>
  <button id="ly-open" type="button" aria-label="레이어 설정 열기" aria-controls="layers" title="레이어 설정">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5l9 5-9 5-9-5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M3 12.5l9 5 9-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 16.5l9 5 9-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>

  <nav id="panel" aria-label="시간 조작">
    <div class="t-row">
      <button id="live" type="button"><span class="dot" aria-hidden="true"></span>실시간</button>
      <button id="pause" type="button" aria-label="멈춤" title="멈춤">
        <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14M16 5v14" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
        <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z" fill="currentColor"/></svg>
      </button>
      <div id="rate-text" aria-live="polite"></div>
    </div>
    <div class="t-row">
      <button id="slower" type="button" aria-label="더 과거 쪽으로" title="더 과거 쪽으로">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 6l-7 6 7 6zM20 6l-7 6 7 6z" fill="currentColor"/></svg>
      </button>
      <div id="rate-wrap">
        <div id="rate-track">
          <span class="mid" aria-hidden="true"></span>
          <input id="rate" type="range" min="0" step="1" aria-label="시간 빠르기">
        </div>
        <div class="rate-scale" aria-hidden="true"><span>과거로</span><span>실제 빠르기</span><span>미래로</span></div>
      </div>
      <button id="faster" type="button" aria-label="더 미래 쪽으로" title="더 미래 쪽으로">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M13 6l7 6-7 6zM4 6l7 6-7 6z" fill="currentColor"/></svg>
      </button>
    </div>
  </nav>

  <section id="compare" aria-label="크기 비교" hidden>
    <div class="cmp-head">
      <div class="tc-head"><span class="tc-title">크기 비교</span><span class="cmp-note">실제 크기 비율</span>
        <button class="tc-close" type="button" data-close="compare"><span>닫기</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
      <div class="tc-pick">
        <select id="cmp-a" aria-label="왼쪽 천체"></select><span class="tc-sep" aria-hidden="true">·</span><select id="cmp-b" aria-label="오른쪽 천체"></select>
      </div>
    </div>
    <div class="cmp-ring" id="cmp-ring-a"></div><div class="cmp-ring" id="cmp-ring-b"></div>
    <div class="cmp-tag" id="cmp-tag-a"><b></b><span class="d"></span></div>
    <div class="cmp-tag" id="cmp-tag-b"><b></b><span class="d"></span></div>
    <p id="cmp-ratio" aria-live="polite"></p>
  </section>
</main>

<script type="module" src="src/main.js"></script>
</body>
</html>
